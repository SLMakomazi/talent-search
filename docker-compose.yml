services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: talent
    volumes:
      - talent-db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres:/demo:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d talent"]
      interval: 5s
      retries: 20
  app:
    build: .
    environment:
      APP_DB_URL: jdbc:postgresql://postgres:5432/talent
      SOURCE_DB_URL: jdbc:postgresql://postgres:5432/company_mock
      SOURCE_DB_USER: company_reader
      SOURCE_DB_PASSWORD: company_reader_demo
      DB_USER: demo
      DB_PASSWORD: demo
      SYNC_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  talent-db:
